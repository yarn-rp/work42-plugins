name: figma
version: 1
description: >
  Figma integration for Work42. Provides the Figma file browser widget (one tab
  per attached figma.com link, sharing the "browser" cookie jar) plus a declared
  Figma remote MCP (mcp-remote https://mcp.figma.com/mcp, injected by the work42
  registry into task and code-review sessions where the widget is active) and a
  using-figma skill explaining how the agent reads the attached links from
  storage and queries the Figma MCP.
author: work42
sdk_version: 6

# work42 registry declaration (figma-plugin-mcp-registry-and-usage .4/.7): the
# Figma remote MCP this plugin contributes. The http transport is bridged to
# stdio via `npx mcp-remote <url>` at injection time; the first call triggers
# mcp-remote's own browser OAuth flow — there is NO widget/token auth here.
# Injected only into sessions whose kind is in `kinds` AND where the owning
# `figma` widget is active. Ignored by the legacy 5-field manifest line-scan.
mcp:
  - name: figma
    widget: figma
    url: https://mcp.figma.com/mcp
    allowedTools: "mcp__figma__*"
    kinds: [task, codeReview]
